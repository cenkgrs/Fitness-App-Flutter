name: repwise
description: Repwise — personalized fitness, workout, nutrition and progress tracking.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Backend
  supabase_flutter: ^2.5.6
  http: ^1.2.0

  # Monetization
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^8.2.3

  # Crash reporting
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^1.2.0

  # UX / animation
  flutter_animate: ^4.5.0
  wakelock_plus: ^1.2.5
  flutter_svg: ^2.0.10+1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
